name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Create .env file
        run: echo "VITE_APP_VERSION=git-$(git rev-parse --short HEAD)" > .env

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Copy LICENSE
        run: cp LICENSE.md dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'live-atlas'
          path: 'dist/'
          if-no-files-found: error

      - name: Upload Java Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: 'live-atlas-jar'
          path: 'java/target/*.jar'
          if-no-files-found: error
